<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Agreement Form PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <h1>Tax Agreement Form</h1>
    <form id="tax-agreement-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="signature">Signature:</label><br>
        <canvas id="signature-canvas" width="300" height="150" style="border:1px solid #000;"></canvas><br>
        <button id="clear-signature">Clear Signature</button><br><br>
        <button type="button" id="generate-pdf">Generate PDF</button>
    </form>

    <script>
        // Signature capture code
        const canvas = document.getElementById('signature-canvas');
        const context = canvas.getContext('2d');
        let drawing = false;

        canvas.addEventListener('mousedown', () => drawing = true);
        canvas.addEventListener('mouseup', () => drawing = false);
        canvas.addEventListener('mousemove', draw);

        function draw(event) {
            if (!drawing) return;
            context.lineWidth = 2;
            context.lineCap = 'round';
            context.strokeStyle = '#000';
            context.lineTo(event.clientX - canvas.offsetLeft, event.clientY - canvas.offsetTop);
            context.stroke();
            context.beginPath();
            context.moveTo(event.clientX - canvas.offsetLeft, event.clientY - canvas.offsetTop);
        }

        document.getElementById('clear-signature').addEventListener('click', (e) => {
            e.preventDefault();
            context.clearRect(0, 0, canvas.width, canvas.height);
        });

        document.getElementById('generate-pdf').addEventListener('click', () => {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            html2canvas(document.getElementById('tax-agreement-form')).then((canvas) => {
                const imgData = canvas.toDataURL('image/png');
                pdf.addImage(imgData, 'PNG', 10, 10);
                pdf.save('tax-agreement.pdf');
            });
        });
    </script>
</body>
</html>
